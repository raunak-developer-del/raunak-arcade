<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Snake — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="../assets/game.css"><style>
.game-wrap{max-width:760px;margin:28px auto;padding:0 16px}.game-panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px);box-shadow:0 18px 60px #0005}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.game-head h1{margin:0}.score{color:#7cf7c5;font-weight:800}.board-shell{margin:18px auto;max-width:520px;width:100%}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,minmax(54px,76px));gap:8px;justify-content:center;margin:12px auto 4px}.controls button,.action-btn{border:1px solid #39436d;border-radius:12px;background:#1b2340;color:white;font-size:1.2rem;font-weight:800;min-height:48px;touch-action:manipulation}.controls button:active,.action-btn:active{background:#35416b}.controls .blank{visibility:hidden}.game-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action-btn{padding:10px 18px;font-size:1rem}.help{text-align:center;color:#aab3d4;font-size:.9rem}.site-footer{margin-top:30px}
</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header>
<main class="game-wrap"><div class="eyebrow"><span class="live-dot"></span> CLASSIC ARCADE</div><section class="game-panel"><div class="game-head"><h1>Snake</h1><div>Score: <span class="score" id="score">0</span></div></div><p class="help">Use arrow keys or the on-screen buttons. Works on phones, tablets, and laptops.</p><div class="board-shell"><canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas></div><div class="game-actions"><button class="action-btn" id="start">Start / Restart</button><button class="action-btn" id="pause">Pause</button></div><div class="controls" aria-label="Touch controls"><span class="blank"></span><button data-dir="up" aria-label="Up">▲</button><span class="blank"></span><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div><p class="help" id="message" aria-live="polite">Press Start to play.</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer>
<script defer src="../assets/script.js"></script><script>
(()=>{const c=document.getElementById('board'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('message');const n=20,cell=24;let snake,food,dir,next,score,timer,running=false,paused=false,over=false;
function placeFood(){do{food={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent=score;running=true;paused=false;over=false;placeFood();msg.textContent='Go! Eat the glowing apple.';draw();clearInterval(timer);timer=setInterval(step,125)}
function draw(){ctx.clearRect(0,0,480,480);ctx.fillStyle='#080d1a';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#17213a';ctx.lineWidth=1;for(let i=0;i<=n;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke()}if(food){ctx.fillStyle='#ff5d8f';ctx.shadowColor='#ff5d8f';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(food.x*cell+12,food.y*cell+12,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#7cf7c5':'#36c99a';ctx.beginPath();ctx.roundRect(p.x*cell+2,p.y*cell+2,cell-4,cell-4,6);ctx.fill()});if(paused||over){ctx.fillStyle='#080d1acc';ctx.fillRect(0,0,480,480);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText(over?'GAME OVER':'PAUSED',240,230);ctx.font='16px system-ui';ctx.fillText(over?'Press Start / Restart':'Press Pause to resume',240,260)}}
function step(){if(!running||paused||over)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some((p,i)=>i<snake.length-1&&p.x===h.x&&p.y===h.y)){over=true;msg.textContent='Game over! Your score: '+score+'. Press Start / Restart to try again.';draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;placeFood()}else snake.pop();draw()}
function change(d){if(d==='up'&&dir.y!==1)next={x:0,y:-1};if(d==='down'&&dir.y!==-1)next={x:0,y:1};if(d==='left'&&dir.x!==1)next={x:-1,y:0};if(d==='right'&&dir.x!==-1)next={x:1,y:0}}
document.addEventListener('keydown',e=>{const k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){e.preventDefault();change(k)}if(e.key===' '){e.preventDefault();togglePause()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.dir)));function togglePause(){if(!running||over)return;paused=!paused;msg.textContent=paused?'Paused. Tap Pause to continue.':'Go!';draw()}document.getElementById('start').addEventListener('click',reset);document.getElementById('pause').addEventListener('click',togglePause);draw()})();
</script></body></html>
