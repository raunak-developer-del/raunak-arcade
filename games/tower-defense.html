<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Tower Defense — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><style>.playwrap{max-width:900px;margin:28px auto;padding:0 14px}.panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px)}.playhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.playhead h1{margin:0}.muted{color:#aab3d4;text-align:center}.boardcanvas{display:block;width:100%;max-width:680px;height:auto;margin:18px auto;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:manipulation}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.buttons button,.pad button,.cellbtn{background:#1b2340;border:1px solid #39436d;color:#fff;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:700;touch-action:manipulation}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.bigstatus{text-align:center;min-height:1.5em;color:#7cf7c5;font-weight:700}.mines{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px;margin:18px auto}.mines button{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(.8rem,3vw,1.2rem);background:#263151;border:1px solid #3c4b70;border-radius:5px;color:#fff;font-weight:800}.mines button.open{background:#d8e0e7;color:#172033}.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:8px;justify-content:center;margin:22px auto}.ttt button{aspect-ratio:1;background:#1b2340;border:1px solid #39436d;border-radius:14px;color:#7cf7c5;font-size:clamp(2rem,9vw,4rem);font-weight:900}.tdgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:560px;margin:18px auto}.tdgrid button{aspect-ratio:1;min-width:0;padding:0;border-radius:5px;border:1px solid #334064;background:#17203a;color:#fff;font-size:clamp(.6rem,2.4vw,1rem)}.tdgrid button.path{background:#39415b}.tdgrid button.tower{background:#175e59}.tdgrid button.enemy{background:#8a3151}.hint{text-align:center;color:#aab3d4;font-size:.9rem}.touchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header><main class="playwrap"><div class="eyebrow"><span class="live-dot"></span> STRATEGY</div><section class="panel"><div class="playhead"><h1>Tower Defense</h1><strong>Coins: <span id="coins">100</span> · Lives: <span id="lives">10</span></strong></div><p class="muted">Tap empty tiles to place a tower (25 coins). Towers automatically stop enemies moving along the path.</p><div class="tdgrid" id="grid"></div><div class="buttons"><button id="wave">Start wave</button><button id="reset">New game</button></div><p id="msg" class="bigstatus">Build towers, then start a wave.</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer><script defer src="../assets/script.js"></script><script>(()=>{const el=document.querySelector('#grid'),co=document.querySelector('#coins'),li=document.querySelector('#lives'),msg=document.querySelector('#msg');const path=new Set([10,11,12,13,14,15,25,35,45,55,56,57,58,59,49,39,29,19,9]);let towers=new Set(),coins=100,lives=10,enemies=[],wave=0,active=false,timer;function render(){el.innerHTML='';for(let i=0;i<60;i++){let b=document.createElement('button');b.textContent=towers.has(i)?'▲':path.has(i)?'·':'';b.className=path.has(i)?'path':'';if(towers.has(i))b.className='tower';b.onclick=()=>{if(!towers.has(i)&&!path.has(i)&&coins>=25){towers.add(i);coins-=25;sync();render()}else if(path.has(i))msg.textContent='Keep the path clear! Place towers beside it.'};el.appendChild(b)}}function sync(){co.textContent=coins;li.textContent=lives}function reset(){clearInterval(timer);towers=new Set();coins=100;lives=10;wave=0;enemies=[];active=false;sync();render();msg.textContent='Build towers, then start a wave.'}function startWave(){if(active)return;active=true;wave++;let spawned=0;msg.textContent='Wave '+wave+' incoming!';timer=setInterval(()=>{if(spawned<5+wave*2){enemies.push({pos:0,hp:2+wave});spawned++}enemies.forEach(e=>{e.pos+=.22;let tile=Math.floor(e.pos)%60;if(towers.size&&Math.random()<.12){e.hp--}if(e.hp<=0)e.dead=true;if(e.pos>59){e.dead=true;lives--}});enemies=enemies.filter(e=>!e.dead);li.textContent=lives;render();el.querySelectorAll('button').forEach((b,i)=>{if(enemies.some(e=>Math.floor(e.pos)%60===i)){b.textContent='●';b.className='enemy'}});if(lives<=0){clearInterval(timer);active=false;msg.textContent='Base lost. Start a new game.'}else if(spawned>=5+wave*2&&!enemies.length){clearInterval(timer);active=false;coins+=35;sync();msg.textContent='Wave cleared! Bonus +35 coins. Build more towers.'}},550)}document.querySelector('#wave').onclick=startWave;document.querySelector('#reset').onclick=reset;render()})();</script></body></html>
