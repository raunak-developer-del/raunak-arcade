<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Brick Breaker — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><style>.playwrap{max-width:900px;margin:28px auto;padding:0 14px}.panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px)}.playhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.playhead h1{margin:0}.muted{color:#aab3d4;text-align:center}.boardcanvas{display:block;width:100%;max-width:680px;height:auto;margin:18px auto;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:manipulation}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.buttons button,.pad button,.cellbtn{background:#1b2340;border:1px solid #39436d;color:#fff;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:700;touch-action:manipulation}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.bigstatus{text-align:center;min-height:1.5em;color:#7cf7c5;font-weight:700}.mines{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px;margin:18px auto}.mines button{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(.8rem,3vw,1.2rem);background:#263151;border:1px solid #3c4b70;border-radius:5px;color:#fff;font-weight:800}.mines button.open{background:#d8e0e7;color:#172033}.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:8px;justify-content:center;margin:22px auto}.ttt button{aspect-ratio:1;background:#1b2340;border:1px solid #39436d;border-radius:14px;color:#7cf7c5;font-size:clamp(2rem,9vw,4rem);font-weight:900}.tdgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:560px;margin:18px auto}.tdgrid button{aspect-ratio:1;min-width:0;padding:0;border-radius:5px;border:1px solid #334064;background:#17203a;color:#fff;font-size:clamp(.6rem,2.4vw,1rem)}.tdgrid button.path{background:#39415b}.tdgrid button.tower{background:#175e59}.tdgrid button.enemy{background:#8a3151}.hint{text-align:center;color:#aab3d4;font-size:.9rem}.touchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header><main class="playwrap"><div class="eyebrow"><span class="live-dot"></span> ARCADE PUZZLE</div><section class="panel"><div class="playhead"><h1>Brick Breaker</h1><strong>Score: <span id="score">0</span></strong></div><p class="muted">Move the paddle with your mouse, ← →, or drag your finger.</p><canvas id="c" class="boardcanvas" width="600" height="480"></canvas><div class="buttons"><button id="start">Start / Restart</button><button id="pause">Pause</button></div><p id="msg" class="bigstatus">Press Start to play.</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer><script defer src="../assets/script.js"></script><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),sc=document.querySelector('#score'),msg=document.querySelector('#msg');let px=250,bx=300,by=400,vx=3,vy=-4,bricks,score=0,running=false,paused=false;function reset(){px=250;bx=300;by=400;vx=3;vy=-4;score=0;sc.textContent=0;bricks=[];for(let r=0;r<5;r++)for(let i=0;i<9;i++)bricks.push({x:12+i*64,y:40+r*27,on:true});running=true;paused=false;msg.textContent='Break every brick!';loop()}function loop(){if(!running)return; x.fillStyle='#080d1a';x.fillRect(0,0,600,480);bricks.forEach((b,i)=>{if(b.on){x.fillStyle=['#7cf7c5','#62b8ff','#b58cff','#ff6688','#ffb45e'][Math.floor(i/9)];x.fillRect(b.x,b.y,56,17)}});x.fillStyle='#7cf7c5';x.fillRect(px,450,100,12);x.beginPath();x.arc(bx,by,8,0,Math.PI*2);x.fill();if(!paused){bx+=vx;by+=vy;if(bx<8||bx>592)vx*=-1;if(by<8)vy*=-1;if(by>438&&by<465&&bx>px&&bx<px+100)vy=-Math.abs(vy);bricks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+56&&by>b.y&&by<b.y+17){b.on=false;vy*=-1;score+=10;sc.textContent=score}});if(by>490){running=false;msg.textContent='Ball lost! Score '+score+'. Restart to play again.'}if(!bricks.some(b=>b.on)){running=false;msg.textContent='You cleared the board! Score '+score+'.'}}if(running)requestAnimationFrame(loop)}function pos(e){const r=c.getBoundingClientRect();px=Math.max(0,Math.min(500,(e.clientX-r.left)/r.width*600-50))}c.addEventListener('pointermove',pos);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px=Math.max(0,px-25);if(e.key==='ArrowRight')px=Math.min(500,px+25)});document.querySelector('#start').onclick=reset;document.querySelector('#pause').onclick=()=>{paused=!paused;if(running&&!paused)loop();msg.textContent=paused?'Paused':'Keep going!'} })();</script></body></html>
