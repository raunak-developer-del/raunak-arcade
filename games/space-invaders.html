<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Space Invaders — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><style>.playwrap{max-width:900px;margin:28px auto;padding:0 14px}.panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px)}.playhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.playhead h1{margin:0}.muted{color:#aab3d4;text-align:center}.boardcanvas{display:block;width:100%;max-width:680px;height:auto;margin:18px auto;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:manipulation}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.buttons button,.pad button,.cellbtn{background:#1b2340;border:1px solid #39436d;color:#fff;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:700;touch-action:manipulation}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.bigstatus{text-align:center;min-height:1.5em;color:#7cf7c5;font-weight:700}.mines{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px;margin:18px auto}.mines button{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(.8rem,3vw,1.2rem);background:#263151;border:1px solid #3c4b70;border-radius:5px;color:#fff;font-weight:800}.mines button.open{background:#d8e0e7;color:#172033}.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:8px;justify-content:center;margin:22px auto}.ttt button{aspect-ratio:1;background:#1b2340;border:1px solid #39436d;border-radius:14px;color:#7cf7c5;font-size:clamp(2rem,9vw,4rem);font-weight:900}.tdgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:560px;margin:18px auto}.tdgrid button{aspect-ratio:1;min-width:0;padding:0;border-radius:5px;border:1px solid #334064;background:#17203a;color:#fff;font-size:clamp(.6rem,2.4vw,1rem)}.tdgrid button.path{background:#39415b}.tdgrid button.tower{background:#175e59}.tdgrid button.enemy{background:#8a3151}.hint{text-align:center;color:#aab3d4;font-size:.9rem}.touchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header><main class="playwrap"><div class="eyebrow"><span class="live-dot"></span> ARCADE ACTION</div><section class="panel"><div class="playhead"><h1>Space Invaders</h1><strong>Score: <span id="score">0</span></strong></div><p class="muted">Move with ← → or drag/touch the screen. Space or FIRE to shoot.</p><canvas id="c" class="boardcanvas" width="600" height="480"></canvas><div class="buttons"><button id="start">Start / Restart</button><button id="fire">FIRE</button><button id="left">◀</button><button id="right">▶</button></div><p id="msg" class="bigstatus">Press Start to defend the galaxy.</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer><script defer src="../assets/script.js"></script><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),sc=document.querySelector('#score'),msg=document.querySelector('#msg');let ship,aliens,shots,enemyShots,score,tick,alive=false;function reset(){ship=275;aliens=[];for(let r=0;r<3;r++)for(let i=0;i<8;i++)aliens.push({x:40+i*65,y:45+r*38,alive:true});shots=[];enemyShots=[];score=0;tick=0;alive=true;sc.textContent=0;msg.textContent='Clear the alien wave!';loop()}function fire(){if(alive)shots.push({x:ship+12,y:420})}function loop(){if(!alive)return;tick++;x.fillStyle='#080d1a';x.fillRect(0,0,600,480);for(let i=0;i<45;i++){x.fillStyle='#7e8dbb';x.fillRect((i*137)%600,(i*71+tick*.2)%480,2,2)}x.fillStyle='#7cf7c5';x.fillRect(ship,430,28,18);x.fillRect(ship+10,420,8,12);if(tick%30===0)aliens.filter(a=>a.alive).forEach(a=>a.y+=5);if(tick%70===0){let aa=aliens.filter(a=>a.alive);if(aa.length)enemyShots.push({x:aa[Math.random()*aa.length|0].x+15,y:aa[0].y+20})}shots.forEach(s=>s.y-=8);enemyShots.forEach(s=>s.y+=4);aliens.forEach(a=>{if(!a.alive)return;x.fillStyle='#ff6688';x.fillRect(a.x,a.y,28,18);shots.forEach(s=>{if(s.x>a.x-5&&s.x<a.x+32&&s.y>a.y&&s.y<a.y+22){a.alive=false;s.y=-50;score+=10;sc.textContent=score}});if(a.y>410)alive=false});shots=shots.filter(s=>s.y>-20);enemyShots.forEach(s=>{x.fillStyle='#ffb45e';x.fillRect(s.x,s.y,4,12);if(s.y>420&&s.x>ship&&s.x<ship+28)alive=false});enemyShots=enemyShots.filter(s=>s.y<500);shots.forEach(s=>{x.fillStyle='#7cf7c5';x.fillRect(s.x,s.y,4,12)});if(!aliens.some(a=>a.alive)){alive=false;msg.textContent='Wave cleared! Score '+score+' — press restart.'}else if(!alive)msg.textContent='Ship lost! Score '+score+' — press restart.';if(alive)requestAnimationFrame(loop)}function move(d){ship=Math.max(0,Math.min(570,ship+d))}document.querySelector('#start').onclick=reset;document.querySelector('#fire').onclick=fire;document.querySelector('#left').onclick=()=>move(-28);document.querySelector('#right').onclick=()=>move(28);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-18);if(e.key==='ArrowRight'||e.key==='d')move(18);if(e.code==='Space'){e.preventDefault();fire()}});let drag=false;c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ship=Math.max(0,Math.min(570,(e.clientX-r.left)/r.width*600-14));fire()});c.addEventListener('pointermove',e=>{if(drag){const r=c.getBoundingClientRect();ship=Math.max(0,Math.min(570,(e.clientX-r.left)/r.width*600-14))}});c.addEventListener('pointerup',()=>drag=false)})();</script></body></html>
