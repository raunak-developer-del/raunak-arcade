<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Neon Runner — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><style>.playwrap{max-width:900px;margin:28px auto;padding:0 14px}.panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px)}.playhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.playhead h1{margin:0}.muted{color:#aab3d4;text-align:center}.boardcanvas{display:block;width:100%;max-width:680px;height:auto;margin:18px auto;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:manipulation}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.buttons button,.pad button,.cellbtn{background:#1b2340;border:1px solid #39436d;color:#fff;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:700;touch-action:manipulation}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.bigstatus{text-align:center;min-height:1.5em;color:#7cf7c5;font-weight:700}.mines{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px;margin:18px auto}.mines button{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(.8rem,3vw,1.2rem);background:#263151;border:1px solid #3c4b70;border-radius:5px;color:#fff;font-weight:800}.mines button.open{background:#d8e0e7;color:#172033}.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:8px;justify-content:center;margin:22px auto}.ttt button{aspect-ratio:1;background:#1b2340;border:1px solid #39436d;border-radius:14px;color:#7cf7c5;font-size:clamp(2rem,9vw,4rem);font-weight:900}.tdgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:560px;margin:18px auto}.tdgrid button{aspect-ratio:1;min-width:0;padding:0;border-radius:5px;border:1px solid #334064;background:#17203a;color:#fff;font-size:clamp(.6rem,2.4vw,1rem)}.tdgrid button.path{background:#39415b}.tdgrid button.tower{background:#175e59}.tdgrid button.enemy{background:#8a3151}.hint{text-align:center;color:#aab3d4;font-size:.9rem}.touchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header><main class="playwrap"><div class="eyebrow"><span class="live-dot"></span> ENDLESS RUNNER</div><section class="panel"><div class="playhead"><h1>Neon Runner</h1><strong>Score: <span id="score">0</span></strong></div><p class="muted">Jump over the blocks. Space / ↑ or tap JUMP. Works on touchscreens.</p><canvas id="c" class="boardcanvas" width="720" height="360" aria-label="Runner game"></canvas><div class="buttons"><button id="start">Start / Restart</button><button id="jump">JUMP</button></div><p id="msg" class="bigstatus">Press Start to run!</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer><script defer src="../assets/script.js"></script><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),msg=document.querySelector('#msg');let player,obs,score,speed,frame,alive=false,over=false;function reset(){player={y:270,vy:0};obs=[];score=0;speed=5;frame=0;alive=true;over=false;msg.textContent='Run! Jump over the neon blocks.';requestAnimationFrame(loop)}function jump(){if(!alive){reset();return}if(player.y>=269)player.vy=-13}function loop(){if(!alive)return;frame++;x.fillStyle='#080d1a';x.fillRect(0,0,720,360);x.strokeStyle='#1c2947';for(let i=0;i<720;i+=36){x.beginPath();x.moveTo(i,0);x.lineTo(i,360);x.stroke()}x.fillStyle='#263151';x.fillRect(0,300,720,60);x.strokeStyle='#7cf7c5';x.lineWidth=3;x.beginPath();x.moveTo(0,300);x.lineTo(720,300);x.stroke();player.vy+=.65;player.y+=player.vy;if(player.y>270){player.y=270;player.vy=0}x.fillStyle='#7cf7c5';x.shadowColor='#7cf7c5';x.shadowBlur=15;x.fillRect(85,player.y,30,30);x.shadowBlur=0;if(frame%70===0)obs.push({x:740,w:22+Math.random()*20,h:30+Math.random()*38});obs.forEach(o=>{o.x-=speed;x.fillStyle='#ff6688';x.fillRect(o.x,300-o.h,o.w,o.h);if(o.x<115&&o.x+o.w>85&&player.y+30>300-o.h){alive=false;over=true;msg.textContent='Crash! Score '+score+'. Press restart to try again.'}});obs=obs.filter(o=>o.x>-50);if(alive){score++;scoreEl.textContent=Math.floor(score/5);speed=Math.min(11,5+score/1500);requestAnimationFrame(loop)}}document.querySelector('#start').onclick=reset;document.querySelector('#jump').onclick=jump;document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump)})();</script></body></html>
