<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b18"><title>Minesweeper — Raunak Arcade</title><link rel="stylesheet" href="../assets/style.css"><style>.playwrap{max-width:900px;margin:28px auto;padding:0 14px}.panel{background:#11152a;border:1px solid #293052;border-radius:18px;padding:clamp(12px,3vw,24px)}.playhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.playhead h1{margin:0}.muted{color:#aab3d4;text-align:center}.boardcanvas{display:block;width:100%;max-width:680px;height:auto;margin:18px auto;background:#080d1a;border:1px solid #293052;border-radius:12px;touch-action:manipulation}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.buttons button,.pad button,.cellbtn{background:#1b2340;border:1px solid #39436d;color:#fff;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:700;touch-action:manipulation}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.bigstatus{text-align:center;min-height:1.5em;color:#7cf7c5;font-weight:700}.mines{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:460px;margin:18px auto}.mines button{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(.8rem,3vw,1.2rem);background:#263151;border:1px solid #3c4b70;border-radius:5px;color:#fff;font-weight:800}.mines button.open{background:#d8e0e7;color:#172033}.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,120px));gap:8px;justify-content:center;margin:22px auto}.ttt button{aspect-ratio:1;background:#1b2340;border:1px solid #39436d;border-radius:14px;color:#7cf7c5;font-size:clamp(2rem,9vw,4rem);font-weight:900}.tdgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:560px;margin:18px auto}.tdgrid button{aspect-ratio:1;min-width:0;padding:0;border-radius:5px;border:1px solid #334064;background:#17203a;color:#fff;font-size:clamp(.6rem,2.4vw,1rem)}.tdgrid button.path{background:#39415b}.tdgrid button.tower{background:#175e59}.tdgrid button.enemy{background:#8a3151}.hint{text-align:center;color:#aab3d4;font-size:.9rem}.touchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="bg-grid" aria-hidden="true"></div><header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links"><a href="../index.html">Home</a><a class="active" href="../games.html">Games</a><a href="../about.html">About</a></nav><a class="header-cta" href="../games.html">All games ↗</a></header><main class="playwrap"><div class="eyebrow"><span class="live-dot"></span> LOGIC PUZZLE</div><section class="panel"><div class="playhead"><h1>Minesweeper</h1><strong>Mines: 10</strong></div><p class="muted">Reveal every safe tile. On touchscreens, use Flag mode to mark suspected mines.</p><div class="buttons"><button id="new">New game</button><button id="flag">Flag mode: OFF</button></div><div class="mines" id="board"></div><p id="msg" class="bigstatus">Good luck!</p></section></main><footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark">R</span><span>RAUNAK<span class="brand-muted"> ARCADE</span></span></a><span>Made with curiosity & code.</span><a href="../games.html">More games ↗</a></footer><script defer src="../assets/script.js"></script><script>(()=>{const board=document.querySelector('#board'),msg=document.querySelector('#msg'),flagBtn=document.querySelector('#flag');let cells,flag=false,ended=false;function init(){cells=Array.from({length:81},()=>({mine:false,open:false,flag:false,n:0}));let count=0;while(count<10){let i=Math.random()*81|0;if(!cells[i].mine){cells[i].mine=true;count++}}cells.forEach((c,i)=>{if(c.mine)return;let r=i/9|0,col=i%9;for(let y=Math.max(0,r-1);y<=Math.min(8,r+1);y++)for(let x=Math.max(0,col-1);x<=Math.min(8,col+1);x++)if(cells[y*9+x].mine)c.n++});ended=false;flag=false;flagBtn.textContent='Flag mode: OFF';msg.textContent='Good luck!';draw()}function reveal(i){if(ended)return;let c=cells[i];if(flag){c.flag=!c.flag;draw();return}if(c.flag||c.open)return;c.open=true;if(c.mine){ended=true;msg.textContent='Boom! Tap New game to try again.'}else if(c.n===0){let r=i/9|0,col=i%9;for(let y=Math.max(0,r-1);y<=Math.min(8,r+1);y++)for(let x=Math.max(0,col-1);x<=Math.min(8,col+1);x++){let j=y*9+x;if(!cells[j].open&&!cells[j].mine)reveal(j)}}if(cells.every(c=>c.mine||c.open)){ended=true;msg.textContent='You cleared the minefield! 🎉'}draw()}function draw(){board.innerHTML='';cells.forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.flag?'⚑':c.open?(c.mine?'💣':c.n||''):'';if(c.open)b.className='open';if(c.open&&c.n)b.style.color=['','#23764e','#2465bd','#bb3d3d','#6643a5','#8c4b21'][c.n]||'#172033';b.onclick=()=>reveal(i);board.appendChild(b)})}flagBtn.onclick=()=>{flag=!flag;flagBtn.textContent='Flag mode: '+(flag?'ON':'OFF')};document.querySelector('#new').onclick=init;init()})();</script></body></html>
